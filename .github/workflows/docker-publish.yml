name: Build, Push & Update GitOps Manifest

on:
  push:
    branches:
      - main
    paths-ignore:
      - ".env.example"
      - "README.md"
      - "**.md"
  pull_request:
    branches:
      - main
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: diniskawolfiii/fvcl_bot
  GITOPS_REPO: DiniskaWolfiii/fvcl-bot-gitops

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify Python syntax
        run: |
          python3 -m py_compile main.py config.py utils.py texts.py \
            handlers/__init__.py handlers/general.py handlers/refill.py handlers/report.py

      - name: Compute image tags
        id: vars
        run: |
          SHORT_SHA=$(git rev-parse --short=7 HEAD)
          echo "short_sha=${SHORT_SHA}" >> "$GITHUB_OUTPUT"
          echo "sha_tag=sha-${SHORT_SHA}" >> "$GITHUB_OUTPUT"

      - name: Set up QEMU (Multi-Arch support)
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Docker Image (main)
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ steps.vars.outputs.sha_tag }}
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Test build Docker Image (Pull Request only - no push)
        if: github.event_name == 'pull_request'
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: false
          cache-from: type=gha

      - name: Update image tag in GitOps repository
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        env:
          GITOPS_TOKEN: ${{ secrets.GITOPS_TOKEN }}
        run: |
          if [ -z "$GITOPS_TOKEN" ]; then
            echo "::warning::GITOPS_TOKEN secret is not set. Skipping GitOps repo update."
            exit 0
          fi
          git clone "https://x-access-token:${GITOPS_TOKEN}@github.com/${GITOPS_REPO}.git" gitops-repo
          cd gitops-repo
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          sed -i "s|newTag: .*|newTag: ${{ steps.vars.outputs.sha_tag }}|g" kustomization.yaml
          if git diff --quiet kustomization.yaml; then
            echo "kustomization.yaml already up to date."
          else
            git add kustomization.yaml
            git commit -m "chore(k8s): update image tag to ${{ steps.vars.outputs.sha_tag }}"
            git pull --rebase origin main
            git push origin HEAD:main
          fi
